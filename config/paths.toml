# --- Note: nine_t_1m ------------------------------------------------------
# The canonical 1 m 9t stack is the 11 loose *_9t_1m.tif files sitting directly
# in data/derivatives/, which is why this key points at a directory rather than
# a tidy stack folder. Proven canonical 2026-08-12: all 7 channels of
# tiles/9t/features_pit_9t_1m.tif -- the stack the models read -- are byte-exact
# against them, and differ from tiles/9t_1m_rebuilt20260812/ on all 7.
#
# They are NOT consolidated into tiles/9t_1m/ yet, deliberately. That directory
# name is what _prep_road_1m.py reads, and it was removed so the script fails
# fast instead of rewriting feature_stats_1m.json with a changed block split.
# See docs/HANDOFF_code_cleanup_wellsight_v2.md:281. Consolidate in Phase 4D,
# after the stats regression is resolved.
