# WellSight path configuration — the single source of truth.
#
# Before this file existed, `notebooks/wellsight_v2/_common.py` hardcoded
#     ROOT = C:\Users\colto\Documents\GitHub\lidar_project
# which pinned the whole project to one username on one machine, and meant every
# future directory move was a hunt through 92 scripts.
#
# Now: 67 scripts import DERIV / DERIV_9T from _common, _common reads this file,
# and a move becomes one edit here.
#
# ROOT RESOLUTION, in order:
#   1. $WELLSIGHT_ROOT           environment variable, if set
#   2. root_override below       if uncommented
#   3. auto                      three parents up from _common.py
# Auto is the default and is correct as long as _common.py stays at
# notebooks/wellsight_v2/_common.py. That location is load-bearing anyway —
# 93 sys.path calls resolve by parents[N] — so it is a safe anchor.

# root_override = "C:/Users/colto/Documents/GitHub/lidar_project"

# --- Layout ----------------------------------------------------------------
# Every value is relative to root and uses forward slashes.
#
# PHASE 4A, 2026-08-12. Every key below is the FULL role-based vocabulary from
# docs/REORGANIZATION_PLAN_phase4_role_based.md section 4. The names are final.
# The values still point at the CURRENT tree, because Phase 4D has not run yet.
#
# That is the whole point. New code writes path_for("truth") today and keeps
# working after the move, because the move is a value change here and nothing
# else. Do not add a key whose value is spelled out anywhere but this file.
[paths]
data          = "data"

# --- AREA-MAJOR, 2026-08-12 (Phase 4F) ------------------------------------
# data/<area>/{derived,models,results,experiments}/ -- everything about one
# study area lives under that area, and role is the second level. Shared things
# that belong to no single area carry an underscore prefix so they sort together
# and read as "not an area": _source, _results, _experiments, _archive.

# shared / not area-specific
source        = "data/_source/lidar"
source_laz    = "data/_source/lidar"                 # legacy alias
reference     = "data/_source/reference"
external      = "data/_source/reference"             # legacy alias
landcover     = "data/_source/reference/landcover"
dep_wells     = "data/_source/reference/dep_wells"
pretrained    = "data/_pretrained"
experiments   = "data/_experiments"
shared_results = "data/_results"
candidates    = "data/_results/candidates"
validation    = "data/_results/validation"
archive       = "data/_archive"

# truth is drawn in QGIS and lives with it. roads.shp spans Oil Creek to
# McKean, so truth cannot decompose per-area anyway.
truth         = "qgis/annotations"
annotations   = "qgis/annotations"                   # legacy alias
truth_grids   = "qgis/annotations/grids"
truth_history = "qgis/annotations/_history"

# 9t -- the primary study area, and where every model is trained
nine_t        = "data/9t/derived/05"
nine_t_1m     = "data/9t/derived/1m"
models        = "data/9t/models"
models_retired = "data/9t/models/_retired"
results_9t    = "data/9t/results"

# other areas
results_613590 = "data/613590/results"
derived       = "data"                               # <area> is the next level
tiles         = "data"                               # legacy alias
data_3x3      = "data"                               # blocks are areas now
label_grids   = "data/grids"
results       = "data/_results"                      # shared results only

# repo-level
literature    = "literature"
docs          = "docs"
ledgers       = "docs/_ledgers"
figures       = "docs/figures"
qgis          = "qgis"
tools         = "tools"

# --- Project constants ----------------------------------------------------
[crs]
# NAD83(2011) / UTM 17N. Every derived product is written in this CRS.
project = "EPSG:6346"
# roads.shp / plat.shp / pit_*.shp ship in WGS84 and are reprojected on read.
annotation_source = "EPSG:4326"

[tools]
# Resolved with shutil.which() first; this is the fallback name only.
pdal = "pdal"

# --- Note ------------------------------------------------------------------
# The canonical 1 m 9t stack now sits at data/9t/derived/1m. _prep_road_1m.py
# reads path_for("derived") / "9t_1m", which does not exist -- deliberately. It
# must keep failing fast until the feature_stats_1m.json block-split regression
# is resolved. See docs/HANDOFF_code_cleanup_wellsight_v2.md:281.
